<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedcritic</title>
<style>
  :root {
    --bg: #faf8f5; --panel: #fff; --text: #1d1b19; --muted: #6b665f;
    --line: #e4dfd7; --accent: #b3361f; --chip: #f1ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --panel: #1f1d1b; --text: #ece8e2; --muted: #a29b91;
      --line: #34302c; --accent: #ef7a5f; --chip: #2a2724;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 12px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 2; }
  h1 { margin: 0 0 10px; font-size: 20px; }
  h1 span { color: var(--muted); font-weight: normal; font-size: 14px; margin-left: 8px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  #podfilter { position: relative; }
  #podfilter summary { list-style: none; cursor: pointer; font: inherit; padding: 8px 30px 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; position: relative; min-width: 160px; }
  #podfilter summary::-webkit-details-marker { display: none; }
  #podfilter summary::after { content: "▾"; position: absolute; right: 10px; color: var(--muted); }
  #podmenu { position: absolute; z-index: 5; top: calc(100% + 4px); right: 0; width: 360px;
    max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25); padding: 6px; }
  #podmenu label { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  #podmenu label:hover { background: var(--chip); }
  #podmenu input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
  #podmenu .name { flex: 1; min-width: 0; }
  #podmenu .n { color: var(--muted); font-size: 12px; }
  #podmenu .all { display: flex; justify-content: space-between; padding: 4px 8px 8px; border-bottom: 1px solid var(--line);
    margin-bottom: 4px; font-size: 13px; color: var(--muted); }
  #podmenu .all button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
  input[type=search], select { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel); color: var(--text); }
  input[type=search] { flex: 1 1 260px; }
  main { display: grid; grid-template-columns: 300px 1fr; max-width: 1200px; margin: 0 auto; }
  #movies { border-right: 1px solid var(--line); height: calc(100vh - var(--hh, 140px));
    overflow-y: auto; position: sticky; top: var(--hh, 140px); padding: 8px 0; }
  #movies { padding-top: 0; }
  #msort { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 8px 16px;
    border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #msort button { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); width: auto; }
  #msort button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #movies .letter { font-weight: 600; color: var(--muted); padding: 12px 16px 3px; font-size: 14px; }
  #mlist button { display: flex; justify-content: space-between; width: 100%; text-align: left;
    border: 0; background: none; color: var(--text); font: inherit; font-size: 17px; line-height: 1.35; padding: 5px 16px; cursor: pointer; }
  #mlist button:hover { background: var(--chip); }
  #mlist button.on { background: var(--accent); color: #fff; }
  #mlist button { justify-content: flex-start; align-items: center; gap: 6px; }
  #movies .t { flex: 1; }
  #movies .count { color: var(--muted); font-size: 14px; min-width: 10px; text-align: right; }
  .pt { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; flex: none;
    display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
  #mlist button.on .count { color: #fff; }
  #results { padding: 12px 16px 40px; }
  #summary { color: var(--muted); margin: 4px 0 12px; }
  #summary a { color: var(--accent); cursor: pointer; }
  #summary .versions { margin-top: 4px; font-size: 13px; }
  .ep { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px;
    display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: start; }
  .ep > .pt { width: 72px; height: 72px; border-radius: 6px; font-size: 24px; }
  @media (max-width: 760px) {
    .ep { grid-template-columns: 48px minmax(0, 1fr); gap: 10px; }
    .ep > .pt { width: 48px; height: 48px; font-size: 16px; }
  }
  .ep h3 { margin: 0 0 4px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 12px;
    cursor: pointer; border: 0; color: var(--text); font-family: inherit; }
  .ep p { margin: 8px 0 0; white-space: pre-line; }
  .ep a { color: var(--accent); }
  mark { background: #f6d860; color: #000; border-radius: 2px; }
  .more { display: block; margin: 16px 0 10px; font: inherit; color: var(--muted); }
  button.more { background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; cursor: pointer; color: var(--text); width: 100%; }
  .tabs { display: flex; gap: 4px; margin: 0 0 10px; }
  .tabs button { font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  body.podcasts-view .controls, body.podcasts-view main { display: none; }
  body:not(.podcasts-view) #podcasts { display: none; }
  #podcasts { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; }
  .pod-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
    display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
  .pod-card > .pt { width: 96px; height: 96px; border-radius: 8px; font-size: 32px; }
  .pod-card h2 { margin: 0 0 4px; font-size: 17px; }
  .pod-card h2 a { color: inherit; text-decoration: none; }
  .pod-card h2 a:hover { text-decoration: underline; }
  .pod-card .stats { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .pod-card .desc { margin: 0 0 10px; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; }
  .pod-card .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .pod-card .actions a { color: var(--accent); }
  .pod-card .browse { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
    background: var(--chip); border: 1px solid var(--line); color: var(--text); }
  @media (max-width: 760px) {
    #podcasts { grid-template-columns: 1fr; }
    .pod-card { grid-template-columns: 64px minmax(0, 1fr); }
    .pod-card > .pt { width: 64px; height: 64px; font-size: 22px; }
  }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 6px; }
  #grab { display: none; }
  /* phones: the results are a bottom sheet over the movie list; drag or tap its handle to hide/show it */
  @media (max-width: 760px) {
    main { display: block; }
    #movies { position: static; height: auto; min-height: calc(100vh - var(--hh, 140px));
      overflow: visible; border-right: 0; padding-bottom: 96px; }
    #msort { top: var(--hh, 140px); }
    #results { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--hh, 140px) + 16px); z-index: 3;
      background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0;
      box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); overflow-y: auto; overscroll-behavior: contain;
      padding-top: 0; transition: transform .25s ease; }
    body.sheet-down #results { transform: translateY(calc(100% - 76px)); overflow: hidden; }
    #grab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      position: sticky; top: 0; z-index: 1; margin: 0 -16px 4px; padding: 12px 16px; min-height: 76px;
      box-sizing: border-box; background: var(--bg); cursor: grab;
      touch-action: none; user-select: none; -webkit-user-select: none; border-bottom: 1px solid var(--line); }
    #grab .bar { width: 56px; height: 6px; border-radius: 3px; background: var(--muted); opacity: .7; }
    #peek { font-size: 15px; color: var(--text); }
    body:not(.sheet-down) #peek { display: none; }
    .controls select, #podfilter { flex: 1 1 140px; min-width: 0; }
    #podfilter summary { min-width: 0; }
    #podmenu { left: 0; right: auto; width: calc(100vw - 32px); }
  }
</style>
</head>
<body>
<header>
  <h1>Feedcritic <span id="stats"></span></h1>
  <nav class="tabs">
    <button id="tab-movies" class="on">Movies</button>
    <button id="tab-podcasts">Podcasts</button>
  </nav>
  <div class="controls">
    <input type="search" id="q" placeholder="Search movie titles, guests… (Enter opens the first movie)" autofocus>
    <details id="podfilter">
      <summary id="podlabel">All podcasts</summary>
      <div id="podmenu"></div>
    </details>
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="az">Movie A–Z</option>
    </select>
  </div>
</header>
<main>
  <nav id="movies">
    <div id="msort">Sort movies:
      <button data-msort="az" class="on">A–Z</button>
      <button data-msort="count">Most episodes</button>
    </div>
    <div id="mlist"></div>
  </nav>
  <section id="results">
    <div id="grab" role="button" tabindex="0" aria-label="Show or hide episodes">
      <span class="bar"></span><span id="peek"></span>
    </div>
    <div id="summary"></div><div id="list"></div>
  </section>
</main>
<section id="podcasts"></section>
<script src="data.js"></script>
<script>
const D = window.FEEDCRITIC;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
let selected = null;
let showDesc = false;
let movieSort = 'az';  // movie list order: 'az' or 'count'
try { if (localStorage.getItem('movieSort') === 'count') movieSort = 'count'; } catch (e) {}  // also list episodes that only mention the search in their description

D.episodes.forEach(e => {
  e._movies = e.movies.map(k => D.movies[k].title).join(' ');
  e._head = fold(e.title + ' \n ' + e._movies);
  e._desc = fold(e.description);
});
for (const m of Object.values(D.movies)) m._t = fold(m.title);
// same title, different year: "halloween 1978", "halloween 2018", "halloween"
const baseKey = k => k.replace(/ (?:1[89]|20)\d\d$/, '');
const VERSIONS = {};
for (const k of D.movie_order) (VERSIONS[baseKey(k)] ||= []).push(k);
$('#stats').textContent = `${Object.keys(D.movies).length} movies · ${D.episodes.length} episodes · ${D.podcasts.length} podcast${D.podcasts.length > 1 ? 's' : ''}`;
// podcast filter: checkboxes; uncheck podcasts to exclude them
const podSel = new Set(D.podcasts.map(p => p.title));  // all checked by default
const podCount = {};
for (const e of D.episodes) podCount[e.podcast] = (podCount[e.podcast] || 0) + 1;

// per-podcast thumbnail: the podcast's artwork, or a generic colored tile with initials
const PODS = Object.fromEntries(D.podcasts.map(p => [p.title, p]));
function genericThumb(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360;
  const initials = name.replace(/^the /i, '').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return `<span class="pt" style="background:hsl(${h} 45% 45%)" title="${esc(name)}">${esc(initials)}</span>`;
}
function podThumb(name) {
  const p = PODS[name];
  if (!p || !p.thumb) return genericThumb(name);
  return `<img class="pt" src="${esc(p.thumb)}" alt="" title="${esc(name)}" onerror="this.outerHTML=genericThumb(this.title)">`;
}

const escRe = w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
// a search word must match the start of a word: "out" finds "Get Out", not "about"
const wordRes = words => words.map(w => new RegExp('(?:^|[^\\p{L}\\p{N}])' + escRe(w), 'u'));
const all = (res, text) => res.every(r => r.test(text));

function hl(text, words) {
  const t = esc(text);
  if (!words.length) return t;
  const re = new RegExp('(^|[^\\p{L}\\p{N}])(' + words.map(escRe).join('|') + ')', 'giu');
  return t.replace(re, '$1<mark>$2</mark>');
}

function render() {
  const q = $('#q').value.trim();
  const words = fold(q).split(/\s+/).filter(Boolean);
  const res = wordRes(words);
  const inPod = e => podSel.has(e.podcast);

  // movie list: only movies whose own title matches; A–Z with letter headings, or by episode count
  const rows = [];
  for (const key of D.movie_order) {
    const m = D.movies[key];
    const n = m.episodes.filter(i => inPod(D.episodes[i])).length;
    if (n && all(res, m._t)) rows.push({ key, m, n });
  }
  if (movieSort === 'count') rows.sort((a, b) => b.n - a.n);  // stable: ties stay A–Z
  let letter = '', html = '';
  for (const { key, m, n } of rows) {
    if (movieSort === 'az') {
      const bare = key.replace(/^(the|a|an) /, '');
      const L = /^[0-9]/.test(bare) ? '#' : bare[0].toUpperCase();
      if (L !== letter) { letter = L; html += `<div class="letter">${L}</div>`; }
    } else if (n !== letter) {
      letter = n; html += `<div class="letter">${n} episode${n === 1 ? '' : 's'}</div>`;
    }
    html += `<button data-k="${key}" class="${key === selected ? 'on' : ''}"><span class="t">${esc(m.title)}</span><span class="count">${n > 1 ? n : ''}</span></button>`;
  }
  $('#mlist').innerHTML = html || `<div class="letter">${podSel.size ? 'No movie titles match' : 'No podcasts selected'}</div>`;

  let eps, extra = [];
  if (selected) {
    eps = D.movies[selected].episodes.map(i => D.episodes[i]).filter(inPod);
    const others = VERSIONS[baseKey(selected)].filter(k => k !== selected);
    const otherLinks = others.map(k => `<a data-k="${k}">${esc(D.movies[k].title)}</a> (${D.movies[k].episodes.length})`).join(', ');
    $('#summary').innerHTML = `${eps.length} episode${eps.length > 1 ? 's' : ''} about <b>${esc(D.movies[selected].title)}</b> · <a id="clear">show all</a>`
      + (others.length ? `<div class="versions">Other versions: ${otherLinks}</div>` : '');
  } else {
    const pool = D.episodes.filter(inPod);
    eps = pool.filter(e => all(res, e._head));
    if (words.length) extra = pool.filter(e => !all(res, e._head) && all(res, e._head + ' \n ' + e._desc));
    $('#summary').textContent = words.length
      ? `${eps.length} episode${eps.length === 1 ? '' : 's'} with “${q}” in the title`
      : `${eps.length} episodes`;
  }
  const s = $('#sort').value;
  const sorter = (a, b) =>
    s === 'old' ? a.date.localeCompare(b.date) :
    s === 'az' ? fold(a._movies || a.title).localeCompare(fold(b._movies || b.title)) :
    b.date.localeCompare(a.date);
  eps.sort(sorter); extra.sort(sorter);

  const hw = selected ? [] : words;
  const card = (e, open) => {
    const chips = e.movies.map(k => `<button class="chip" data-k="${k}">🎬 ${esc(D.movies[k].title)}</button>`).join('');
    return `<article class="ep">
      ${podThumb(e.podcast)}
      <div>
      <h3>${hl(e.title, hw)}</h3>
      <div class="meta">${chips}<span>${e.date}</span>${D.podcasts.length > 1 ? `<span>${esc(e.podcast)}</span>` : ''}
        ${e.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">page</a>` : ''}
        ${e.audio ? `<a href="${esc(e.audio)}" target="_blank" rel="noopener">audio</a>` : ''}</div>
      ${e.description ? `<details ${open ? 'open' : ''}><summary>Description</summary><p>${hl(e.description, hw)}</p></details>` : ''}
      </div>
    </article>`;
  };
  let out = eps.slice(0, 300).map(e => card(e, false)).join('');
  if (eps.length > 300) out += `<p class="meta">Showing first 300 — refine your search.</p>`;
  if (extra.length) {
    out += showDesc
      ? `<h4 class="more">${extra.length} more mention “${esc(q)}” in the description</h4>` + extra.slice(0, 300).map(e => card(e, true)).join('')
      : `<button class="more" id="more">Show ${extra.length} more episode${extra.length === 1 ? '' : 's'} that mention “${esc(q)}” in the description</button>`;
  }
  $('#list').innerHTML = out;
  $('#peek').textContent = $('#summary').innerText.split('\n')[0].replace(/ · show all$/, '');
  const clear = $('#clear');
  if (clear) clear.onclick = () => select(null);
  const more = $('#more');
  if (more) more.onclick = () => { showDesc = true; render(); };
}

function renderPodcasts() {
  const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, { year: 'numeric', month: 'short' }) : '?';
  $('#podcasts').innerHTML = D.podcasts.map(p => {
    const eps = D.episodes.filter(e => e.podcast === p.title);
    const dates = eps.map(e => e.date).filter(Boolean).sort();
    const movies = new Set(eps.flatMap(e => e.movies));
    const shared = [...movies].filter(k => D.movies[k].episodes.some(i => D.episodes[i].podcast !== p.title)).length;
    const stats = [
      `${eps.length} episodes`,
      `${movies.size} movies`,
      D.podcasts.length > 1 ? `${shared} also on other podcasts` : '',
      dates.length ? `${fmtDate(dates[0])} – ${fmtDate(dates[dates.length - 1])}` : '',
    ].filter(Boolean).join(' · ');
    return `<article class="pod-card">
      ${podThumb(p.title)}
      <div>
        <h2>${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h2>
        <div class="stats">${stats}</div>
        ${p.description ? `<p class="desc" title="${esc(p.description)}">${esc(p.description)}</p>` : ''}
        <div class="actions">
          <button class="browse" data-pod="${esc(p.title)}">Browse episodes</button>
          ${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">website</a>` : ''}
          <a href="${esc(p.feed)}" target="_blank" rel="noopener">RSS feed</a>
        </div>
      </div>
    </article>`;
  }).join('');
}

// keep the sticky movie list just below the header, whatever its height
function setHH() {
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');
}

function setView(v) {
  document.body.classList.toggle('podcasts-view', v === 'podcasts');
  $('#tab-movies').classList.toggle('on', v !== 'podcasts');
  $('#tab-podcasts').classList.toggle('on', v === 'podcasts');
  if (v === 'podcasts') {
    renderPodcasts();
    if (location.hash !== '#podcasts') history.pushState(null, '', '#podcasts');
  } else if (location.hash === '#podcasts') {
    history.pushState(null, '', selected ? '#' + encodeURIComponent(selected) : location.pathname + location.search);
  }
  setHH();
  window.scrollTo({ top: 0 });
}
$('#tab-movies').onclick = () => setView('movies');
$('#tab-podcasts').onclick = () => setView('podcasts');
$('#podcasts').addEventListener('click', e => {
  const b = e.target.closest('[data-pod]');
  if (!b) return;
  podSel.clear();
  podSel.add(b.dataset.pod);
  syncPodMenu();
  selected = null;
  setView('movies');
  render();
});
window.addEventListener('popstate', () => setView(location.hash === '#podcasts' ? 'podcasts' : 'movies'));

function select(k) {
  selected = selected === k ? null : k;
  location.hash = selected ? encodeURIComponent(selected) : '';
  render();
  if (isPhone()) {
    if (selected) setSheet(false);
    $('#results').scrollTop = 0;
  } else {
    window.scrollTo({ top: 0 });
  }
}

// --- phone bottom sheet -------------------------------------------------
const phoneMQ = matchMedia('(max-width: 760px)');
const isPhone = () => phoneMQ.matches;
function setSheet(down) {
  document.body.classList.toggle('sheet-down', down);
}
(() => {
  const grab = $('#grab'), sheet = $('#results');
  let drag = null;
  grab.addEventListener('pointerdown', e => {
    if (!isPhone()) return;
    const down = document.body.classList.contains('sheet-down');
    const max = sheet.offsetHeight - 76;  // how far the sheet travels
    drag = { y: e.clientY, dy: 0, start: down ? max : 0, max };
    grab.setPointerCapture(e.pointerId);
    sheet.style.transition = 'none';
  });
  grab.addEventListener('pointermove', e => {
    if (!drag) return;
    drag.dy = e.clientY - drag.y;
    const t = Math.min(drag.max, Math.max(0, drag.start + drag.dy));
    sheet.style.transform = `translateY(${t}px)`;
  });
  const end = () => {
    if (!drag) return;
    const { dy } = drag;
    drag = null;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (Math.abs(dy) < 6) setSheet(!document.body.classList.contains('sheet-down'));  // tap toggles
    else if (dy > 60) setSheet(true);
    else if (dy < -60) setSheet(false);
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  grab.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSheet(!document.body.classList.contains('sheet-down')); }
  });
})();
document.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b) select(b.dataset.k);
});
$('#q').addEventListener('input', () => { selected = null; showDesc = false; render(); });
// Enter jumps to the first matching movie
$('#q').addEventListener('keydown', e => {
  const first = $('#mlist button');
  if (e.key === 'Enter' && first) select(first.dataset.k);
});
function syncPodMenu() {
  document.querySelectorAll('#podmenu input').forEach(c => { c.checked = podSel.has(c.value); });
  const n = podSel.size;
  $('#podlabel').textContent = n === D.podcasts.length ? 'All podcasts' : n === 0 ? 'No podcasts' : n === 1 ? [...podSel][0] : `${n} podcasts`;
}
$('#podmenu').innerHTML = `<div class="all"><span>Show episodes from</span><span><button type="button" id="podall">All</button> · <button type="button" id="podnone">None</button></span></div>`
  + D.podcasts.map(p => `<label><input type="checkbox" value="${esc(p.title)}">${podThumb(p.title)}`
    + `<span class="name">${esc(p.title)}</span><span class="n">${podCount[p.title] || 0}</span></label>`).join('');
$('#podmenu').addEventListener('change', e => {
  if (!e.target.matches('input')) return;
  e.target.checked ? podSel.add(e.target.value) : podSel.delete(e.target.value);
  syncPodMenu();
  render();
});
$('#podall').onclick = () => { D.podcasts.forEach(p => podSel.add(p.title)); syncPodMenu(); render(); };
$('#podnone').onclick = () => { podSel.clear(); syncPodMenu(); render(); };
syncPodMenu();
// close the menu when clicking elsewhere or pressing Escape
document.addEventListener('click', e => { if (!$('#podfilter').contains(e.target)) $('#podfilter').open = false; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#podfilter').open = false; });
function setMovieSort(v) {
  movieSort = v;
  document.querySelectorAll('#msort button').forEach(b => b.classList.toggle('on', b.dataset.msort === v));
  try { localStorage.setItem('movieSort', v); } catch (e) {}
  render();
  $('#movies').scrollTop = 0;
  if (isPhone()) window.scrollTo({ top: 0 });
}
document.querySelectorAll('#msort button').forEach(b => b.onclick = () => setMovieSort(b.dataset.msort));
document.querySelectorAll('#msort button').forEach(b => b.classList.toggle('on', b.dataset.msort === movieSort));
$('#sort').addEventListener('change', render);
const h = decodeURIComponent(location.hash.slice(1));
if (h && D.movies[h]) selected = h;
render();
if (isPhone() && !selected) setSheet(true);
if (h === 'podcasts') setView('podcasts');
setHH();
window.addEventListener('resize', setHH);
</script>
</body>
</html>
